{%load static%}
<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device, initial-scale=1.0">
  <title>Kimathi TenderFlow Pro | Login</title>

  <!--Favicon-->
  <link rel="icon" type="image/x-icon" href="{%static 'favicon.ico' %}">

  <!--Tailwind-->
  <script src="https://cdn.tailwindcss.com"></script>

  <!--Feather Icons-->
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>

  <!--Tailwind Config-->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'kimathi-green': '#2E8B57',
            'kiamthi-yellow': '#FFD700',
            'kimathi-light': '#F0FFF0',
            'kimathi-dark': '#0A0A0A',
          }
        }
      }
    };
  </script>
</head>

<body class="bg-kimathi-dark text-white">
  <div class="min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-kimathi-green/10 p-10 rounded-xl shadow-xl border border-kimathi-green/40">
      <div class="text-center">
        <img src="{%static 'img/logo.png' %}" alt="DeKUT Logo" class="mx-auto h-20 w-auto">
        <h2 class="mt-6 text-3xl font-extrabold text-kimathi-yellow">Login to Your Account</h2>
        <p class="mt-2 text-sm text-gray-300">
          Access the Kimathi TenderFlow Pro dashboard
        </p>
      </div>
      
      <form class="mt-8 space-y-6" action="#" method="POST">
        <input type="hidden" name="remember" value="true">

        <div class="space-y-4">
          <!--Email-->
          <div class="relative">
            <input id="email-address" name="email" type="email" autocomplete="email" required
                class="block w-full px-3 py-3 bg-transparent border border-kimathi-yellow text-white placeholder-gray-400 rounded-md focus:outline-none focus:ring-2 focus:ring-kimathi-yellow" placeholder="Email address">
              <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                <i data-feather="mail" class="h-5 w-5 text-kimathi-yellow"></i>
              </div>
            </div>
            
            <!--Password-->
            <div class="relative">
              <input id="password" name="password" type="password" autocomplete="current-password" required
               class="block w-full px-3 py-3 bg-transparent border border-kimathi-yellow text-white placeholder-gray-400 rounded-md focus:outline-none focus:ring-2 focus:ring-kimathi-yellow"
               placeholder="Password">
              <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                <i data-feather="lock" class="h-5 w-5 text-kimathi-yellow"></i>
               </div>
              </div>
             </div>
             
             <!--Remember & Forgot-->
             <div class="flex items-center justify-between text-gray-300">
              <div class="flex items-center">
                <input id="remember-me" name="remember me" type="checkbox"
                  class="h-4 w-4 text-kimathi-yellow focus:ring-kimathi-yellow border-gray-600 rounded bg-transparent">
                <label for="remember-me" class="ml-2 block text-sm">Remember me</label>
              </div>
              <a href="#" class="text-sm text-kimathi-yellow hover:underline">Forgot your password?</a>
             </div>
             
             <!--Submit Button-->
             <div>
               <button type="submit"
                  class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-black bg-kimathi-yellow hover:bg-yellow-400 focus;outline-none focus:ring-2 focus:ring-offset-2 focus:ring-kimathi-green transition">
                  <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                    <i data-feather="log-in" class="h-5 w-5 text-kimathi-dark"></i>
                  </span>
                  Sign in
               </button>
              </div>
             </form>
             
             <div class="text-center">
              <p class="text-sm text-gray-300">
                Don't have an account?
                <a href="register.html" class="font-medium text-kimathi-yellow hover:underline">
                  Register here
                 </a>
                </p>
              </div>
             </div>
            </div>
            
            <script>
               feather.replace();
            </script>
          </body>
        </html>
