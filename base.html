{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tender Management System</title>
  
  <!--bootstarp css-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!--Custom CSS-->
  <link rel="stylesheet" href="{% static 'css/site.css' %}">

  <!--Kimathi green-->
  <style>
    :root {
      --kimathi-green: #2E8B57;
    }
    .bg-kimathi { background-color: var(--kimathi-green);}
    .text-kimathi { color: var(--kimathi-green);}
    .btn-kimathi { background-color: var(--kimathi-green); color: white; }
    .btn-kimathi:hover { background-color: #246644; color: white;}
  </style>  
</head>

<body>

   <!--Navbar-->
   <nav class="navbar navbar-expand-lg navbar-dark bg-kimathi">
      <div class="container-fluid">
         <a class="navbar-brand" href="{% url 'index' %}">DeKUT TMS</a>

         <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                 data-bs-target="#navbarNav" aria-controls="navbarNav"
                 aria-expanded="false" aria-label="Toggle navigation">
             <span class="navbar-toggler-icon"></span>
         </button>
         
         <div class="collapse navbar-collapse" id="navbarNav">


           <!--LINKS ON THE LEFT SIDE  <toa>-->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

              <li class="nav-item">
                <a class="nav-link" href="{% url 'tender_list' %}">Tenders</a>
              </li>
              
              <li class="nav-item">
                <a class="nav-link" href="{% url 'suppliers' %}">Suppliers</a>
              </li>
              
              <li class="nav-item">
                 <a class="nav-link" href="{% url 'reports' %}">Reports</a>
              </li>
              
              <li class="nav-item">
                 <a class="nav-link" href="{% url 'contact' %}">Contact</a>
              </li>
            </ul>

            <!--LOGIN/LOGOUT-->
            <ul class="navbar-nav">
              {% if user.is_authenticated %}
                 <li class="nav-iem">
                    <a class="nav-link text-warning" href="{% url 'logout' %}">Logout</a>
                 </li>
              {% else %}
                 <li class="nav-item">
                    <a class="nav-link text-info" href="{% url 'login' %}">Login</a>
                 </li> 
                 <li class="nav-item">
                     <a class="nav-link text-success" href="{% url 'register' %}">Register</a>
                 </li>
              {% endif %}
            </ul>
            
         </div>
      </div>
    </nav>
    
    <!--MAIN CONTENT-->
    <div class="container mt-4">
      {% block content %}
      {% endblock %}
    </div>
    
    <!--Footer-->
    <footer class="bg-dark text-white text-center py-3 mt-4">
      &copy; {{ now|default:"2025" }} DeKUT Tender Management System
    </footer>
    
    <!--Bootstrap js-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
