{% load static%}
<! DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Kmathi TenderFlow Pro | Register</title>

  <link rel="icon" href="{% static 'favicon.ico' %}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'kimathi-green': '#2E8B57',
            'kimathi-yellow': '#FFD700',
            'kimathi-light': '#F0FFF0',
            'kimathi-dark': '#1A3E29',
          }
        }
      }
    };
  </script>
</head>

<body class="bg-black text-gray-100 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full bg-gray-900 rounded-2xl shadow-xl p-10 space-y-8">
    <div class="text-center">
      <img src="{% static 'img/logo.png' %}" alt="DKU Logo"
      class="mx-auto h-20 w-auto">
      <h2 class="mt-6 text-3xl font-extrabold text-kimathi-yellow">Create Your Account</h2>
      <p class="mt-2 text-sm text-gray-400">Join Kimathi TenderFlow Pro today</p>
    </div>
    
    <form class="mt-8 space-y-6" action="#" method="POST">
      <div class="space-y-4">
        <!--Full Name-->
        <div class="relative">
          <input id="full-name" name="full-name" type="text" required
            class="w-full px-4 py-3 bg-gray-800 text-white border border-gray-700 rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-kimathi-yellow"
            placeholder="Full Name">
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
             <i data-feather="user" class="h-5 w-5 text-gray-400"></i>
          </div>
        </div>
        
        <!--Email-->
        <div class="relative">
          <input id="email-address" name="email" type="email" autocomplete="email" required
            class="w-full px-4 py-3 bg-gray-800 text-white border border-gray-700 rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-kimathi-yellow"
            placeholder="Email address">
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
            <i data-feather="mail" class="h-5 w-5 text-gray-400"></i>
          </div>
        </div>
        
        <!--Passowrd-->
        <div class="relative">
          <input id="password" name="password" type="passowrd" required
             class="w-full px-4 py-3 bg-gray-800 text-white border border-gray-700 rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-kimathi-yellow"
             placeholder="Passowrd">
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer -events-none">
            <i data-feather="lock" class="h-5 w-5 text-gray-400"></i>
          </div>
        </div>
        
        <!--Confirm Password-->
        <div class="relative">
          <input id="confirm-passowrd" name="confirm-password"
          type="password" required
             class="w-full px-4 py-3 bg-gray-800 text-white border border-gray-700 rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-kimathi-yellow"
             placeholder="Confirm Password">
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
            <i data-feather="lock" class="h-5 w-5 text-gray-400"></i>
          </div>
        </div>
      </div>
      
      <!--Terms-->
      <div class="flex items-center text-gray-300">
        <input id="terms" name="terms" type="checkbox" class="h-4 w-4 text-kimathi-green focus:ring-kimathi-yellow border-gray-500 rounded">
        <label for="terms" class="ml-2 text-sm">
          I agree to the <a href="#" class="text-kimathi-yellow hover:underline">Terms and Conditions</a>
        </label>
      </div>
      
      <!--Register Button-->
      <button type="submit"
        class="w-full bg-kimathi-green text-white py-3 px-6 rounded-lg font-semibold hover:bg-green-700 transition flex items-center justify-center">
        <i data-feather="user-plus" class="mr-2 text-kimathi-yellow"></i> Register
      </button>
    </form>
    
    <div class="text-center text-gray-400">
      <p class="text-sm">
        Already have an account?
        <a href="{% url 'login' %}" class="text-kimathi-yellow hover:underline">Login here</a>
      </p>
    </div>
  </div>
  
  <script>feather.replace();</script>
</body>
</html>
